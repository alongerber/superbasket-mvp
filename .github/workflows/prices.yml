name: Refresh public supermarket prices
on:
  workflow_dispatch:
  schedule:
    - cron: '18 */3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install 'israeli-prices'
      - run: python scripts/fetch_prices.py
      - name: Commit actual price snapshot
        run: |
          git config user.name "superbasket-bot"
          git config user.email "superbasket-bot@users.noreply.github.com"
          git add public/prices.json
          git diff --cached --quiet || (git commit -m "Refresh published price snapshot" && git push)
