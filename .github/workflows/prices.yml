name: Refresh official national prices
on:
  workflow_dispatch:
  schedule:
    - cron: '18 */3 * * *'
  push:
    branches: [main, codex/salik-national]
    paths:
      - 'scripts/fetch_prices.py'
      - 'scripts/requirements.txt'
      - '.github/workflows/prices.yml'
permissions:
  contents: write
concurrency:
  group: official-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore last successful snapshots
        run: |
          if git fetch origin price-data --depth=1; then
            git worktree add .snapshots FETCH_HEAD
          else
            git worktree add --detach .snapshots HEAD
            git -C .snapshots checkout --orphan price-data
            git -C .snapshots rm -rf .
          fi
          python -c 'from pathlib import Path; Path(".snapshots/vercel.json").write_text("{\"ignoreCommand\":\"exit 0\"}\n")'
      - run: pip install -r scripts/requirements.txt
      - name: Collect all accessible official branches
        run: python scripts/fetch_prices.py --workers 8
      - name: Validate checksums and coverage before publishing
        run: python scripts/validate_data.py
      - name: Publish atomic price generation
        run: |
          cd .snapshots
          git config user.name "superbasket-bot"
          git config user.email "superbasket-bot@users.noreply.github.com"
          git add manifest.json objects checkpoint-*.json vercel.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official prices"
            git push origin HEAD:price-data
          fi
      - name: Record measured coverage
        if: always()
        run: |
          python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
