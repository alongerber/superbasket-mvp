<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superbasket MVP</title><style>body{font-family:system-ui,Arial;background:#f4f6f8;color:#152536;margin:0;padding:18px}main{max-width:620px;margin:auto}section{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #0001}textarea,input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;margin:8px 0}textarea{height:160px}button{background:#126e50;color:white;border:0;font-weight:700}small{color:#64748b}</style></head><body><main><h1>הסל שלי</h1><p>בדיקת היתכנות להשוואת מחירי סל בין סופרמרקטים בישראל</p><section><label>עיר<input id="city" value="חיפה"></label><label>רשימת קניות<textarea id="items">חלב 3% 1 ליטר
ביצים 12 יחידות
פסטה 500 גרם</textarea></label><button id="compare">בדוק חיבור למחירי אמת</button><p id="status"></p></section><section><h2>סטטוס המערכת</h2><p>ממשק עובד. עדיין אין חיבור מאומת למקור מחירים. לא יוצגו מחירים מומצאים.</p><small>השלב הבא: אימות API או הורדת קובצי שקיפות מחירים של הרשתות.</small></section></main><script>document.getElementById('compare').onclick=async()=>{const status=document.getElementById('status');status.textContent='בודק חיבור...';try{const r=await fetch('/api/status');const j=await r.json();status.textContent=j.connected?'מקור הנתונים מחובר':'מקור נתוני המחירים עדיין לא מחובר';}catch(e){status.textContent='לא ניתן לבדוק את השרת';}}</script></body></html>
