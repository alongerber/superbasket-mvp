name: Verify application
on:
  push:
    branches: [main, codex/collector-timeout]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --version
      - run: node --check public/app.js
      - run: node --test tests/compare.test.mjs tests/product-needs.test.mjs tests/equivalents.test.mjs tests/collection-health.test.mjs tests/product-prices.test.mjs tests/basket-paging.test.mjs tests/product-images.test.mjs tests/recognition.test.mjs tests/shopping-planner.test.mjs
      - run: node scripts/build.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
