name: Refresh official national prices
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */2 * * *'
  push:
    branches: [main, codex/salik-national, codex/collector-timeout]
    paths:
      - 'scripts/*.py'
      - 'data/cities.json'
      - 'scripts/requirements.txt'
      - '.github/workflows/prices.yml'
permissions:
  contents: write
concurrency:
  group: official-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COLLECTION_MAX_SECONDS: ${{ github.event_name == 'push' && '180' || '2400' }}
      CHAIN_MAX_SECONDS: '900'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore last successful snapshots
        run: |
          if git fetch origin price-data --depth=1; then
            git worktree add .snapshots FETCH_HEAD
          else
            git worktree add --detach .snapshots HEAD
            git -C .snapshots checkout --orphan price-data
            git -C .snapshots rm -rf .
          fi
          python -c 'from pathlib import Path; [p.unlink() for p in Path(".snapshots").glob("checkpoint-*.json")]'
          python -c 'from pathlib import Path; Path(".snapshots/vercel.json").write_text("{\"ignoreCommand\":\"exit 0\"}\n")'
      - run: pip install -r scripts/requirements.txt
      - name: Collect all accessible official branches
        run: python scripts/run_collection.py
      - name: Validate checksums and coverage before publishing
        run: python scripts/validate_data.py
      - name: Record measured coverage
        if: always()
        run: |
          python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
